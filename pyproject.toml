[project]
name = "followme"
version = "0.1.0"
description = "Consenting-subject follow-me drone with face + body re-identification"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "opencv-python",
  "onnxruntime",
  "ultralytics",
  "insightface",
  "mavsdk",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["followme*"]
